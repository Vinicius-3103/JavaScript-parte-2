<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ex. 10 — Desafio: playlist da turma</title>
  <!-- Leia as instruções nos comentários do script.js -->
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <h1>Playlist da formatura</h1>
  <label>Gênero:
    <select id="genero">
      <option value="todos">Todos</option>
      <option value="pop">Pop</option>
      <option value="rock">Rock</option>
      <option value="funk">Funk</option>
    </select>
  </label>
  <label><input type="checkbox" id="ordenar"> Mais votadas primeiro</label>
  <ul id="lista"></ul>
  <p id="duracao"></p>
</body>
</html>
