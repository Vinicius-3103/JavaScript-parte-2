<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ex. 06 — Hover com mouseenter/mouseleave</title>
  <!-- Leia as instruções nos comentários do script.js -->
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <h1>Passe o mouse nos cartões</h1>
  <div class="cartoes">
    <div class="cartao" data-dica="HTML: estrutura">HTML</div>
    <div class="cartao" data-dica="CSS: aparência">CSS</div>
    <div class="cartao" data-dica="JS: comportamento">JS</div>
  </div>
  <p id="dica">Passe o mouse em um cartão.</p>
  <p id="coords"></p>
</body>
