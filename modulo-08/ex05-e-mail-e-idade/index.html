<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ex. 05 — E-mail e idade</title>
  <!-- Leia as instruções nos comentários do script.js -->
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <h1>Cadastro no grêmio</h1>
  <form id="form" novalidate>
    <div class="campo"><label for="email">E-mail</label><input id="email" type="email"><small class="msg"></small></div>
    <div class="campo"><label for="idade">Idade</label><input id="idade" type="number"><small class="msg"></small></div>
    <button>Cadastrar</button>
    <p id="resultado"></p>
  </form>
</body>
</html>
