<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ex. 09 — Ache o bug: formulários</title>
  <!-- Leia as instruções nos comentários do script.js -->
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <h1>Ache o bug</h1>
  <form id="form" novalidate>
    <div class="campo"><label for="nome">Nome</label><input id="nome"><small class="msg"></small></div>
    <div class="campo"><label for="idade">Idade</label><input id="idade" type="number"><small class="msg"></small></div>
    <label><input id="termos" type="checkbox"> Aceito os termos</label>
    <button>Enviar</button>
    <p id="resultado"></p>
  </form>
</body>
